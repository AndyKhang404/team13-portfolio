pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types; # Mime types for serving css/js
    default_type application/octet-stream;

    server {
        listen 8080;
        location / {
            root /usr/share/nginx/html;
        }
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","code":200}';
        }
    }
}
